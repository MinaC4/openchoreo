apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lan-observability-tls
  namespace: openchoreo-observability-plane
spec:
  secretName: lan-observability-tls
  issuerRef:
    name: cluster-agent-observabilityplane-selfsigned-issuer
    kind: Issuer
  dnsNames:
    - observer.192.168.1.3.nip.io
    - finops-agent.192.168.1.3.nip.io
    - rca-agent.192.168.1.3.nip.io
