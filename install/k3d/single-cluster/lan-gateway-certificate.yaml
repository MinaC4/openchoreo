apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lan-gateway-tls
  namespace: openchoreo-control-plane
spec:
  secretName: lan-gateway-tls
  issuerRef:
    name: cluster-gateway-selfsigned-issuer
    kind: Issuer
  dnsNames:
    - openchoreo.192.168.1.3.nip.io
    - api.192.168.1.3.nip.io
    - thunder.192.168.1.3.nip.io
    - argocd.192.168.1.3.nip.io
