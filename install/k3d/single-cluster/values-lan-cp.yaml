# LAN overlay for the current development host.
# Replace 192.168.1.3 with the host's stable LAN IP when deploying elsewhere.
openchoreoApi:
  http:
    hostnames:
      - api.192.168.1.3.nip.io
  config:
    server:
      publicUrl: "https://api.192.168.1.3.nip.io:18443"
    remoteConnect:
      enabled: true
      entrypointAddress: "192.168.1.3:30443"
      agentImage:
        tag: latest-dev

backstage:
  secretName: backstage-secrets
  baseUrl: "https://openchoreo.192.168.1.3.nip.io:18443"
  http:
    hostnames:
      - openchoreo.192.168.1.3.nip.io

portalAssistant:
  config:
    observerApiUrl: "https://observer.192.168.1.3.nip.io:11085"

security:
  oidc:
    issuer: "https://thunder.192.168.1.3.nip.io:18443"
    # Backstage/OpenChoreo API call Thunder from inside the cluster for
    # token exchange and JWT validation; keep the issuer and authorization
    # endpoint public for browsers on the LAN.
    jwksUrl: "http://thunder-service.thunder.svc.cluster.local:8090/oauth2/jwks"
    authorizationUrl: "https://thunder.192.168.1.3.nip.io:18443/oauth2/authorize"
    tokenUrl: "http://thunder-service.thunder.svc.cluster.local:8090/oauth2/token"

gateway:
  httpPort: 8080
  httpsPort: 8443
  tls:
    enabled: true
    hostname: ""
    certificateRefs:
      - name: lan-gateway-tls

features:
  secretManagement:
    enabled: true
