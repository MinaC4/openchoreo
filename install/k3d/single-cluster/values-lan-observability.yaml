# LAN overlay for the current development host.
# Replace 192.168.1.3 with the host's stable LAN IP when deploying elsewhere.
finOpsAgent:
  openchoreoApiUrl: "https://api.192.168.1.3.nip.io:18443"
  cors:
    allowedOrigins:
      - "https://openchoreo.192.168.1.3.nip.io:18443"
  http:
    hostnames:
      - finops-agent.192.168.1.3.nip.io

observer:
  secretName: observer-secret
  controlPlaneApiUrl: "https://api.192.168.1.3.nip.io:18443"
  cors:
    allowedOrigins:
      - "https://openchoreo.192.168.1.3.nip.io:18443"
  extraEnvs:
    - name: OBSERVER_BASE_URL
      value: "https://observer.192.168.1.3.nip.io:11085"
    - name: AUTHZ_TIMEOUT
      value: "30s"
  http:
    hostnames:
      - observer.192.168.1.3.nip.io

security:
  oidc:
    jwksUrl: "http://thunder-service.thunder.svc.cluster.local:8090/oauth2/jwks"
    tokenUrl: "http://thunder-service.thunder.svc.cluster.local:8090/oauth2/token"
    authServerBaseUrl: "https://thunder.192.168.1.3.nip.io:18443"

rca:
  openchoreoApiUrl: "https://api.192.168.1.3.nip.io:18443"
  cors:
    allowedOrigins:
      - "https://openchoreo.192.168.1.3.nip.io:18443"
  http:
    hostnames:
      - rca-agent.192.168.1.3.nip.io

gateway:
  httpPort: 11080
  httpsPort: 11085
  tls:
    enabled: true
    hostname: ""
    certificateRefs:
      - name: lan-observability-tls
