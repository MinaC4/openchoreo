apiVersion: v1
kind: Namespace
metadata:
  name: argocd
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: argocd-server
  namespace: argocd
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: openchoreo-control-plane
  to:
    - group: ""
      kind: Service
      name: argocd-server
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: openchoreo-control-plane
spec:
  parentRefs:
    - name: gateway-default
      sectionName: http
    - name: gateway-default
      sectionName: https
  hostnames:
    - argocd.192.168.1.3.nip.io
  rules:
    - backendRefs:
        - name: argocd-server
          namespace: argocd
          port: 80
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openchoreo-getting-started
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MinaC4/openchoreo.git
    targetRevision: codex/full-stack-lan
    path: samples/getting-started
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
